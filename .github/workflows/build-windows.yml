name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install "pyinstaller>=6.11,<7"

      - name: Check launcher syntax
        run: python -m py_compile desktop.py

      - name: Build lipano.exe
        run: pyinstaller --noconfirm --clean lipano.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lipano-windows
          path: dist/lipano.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/lipano.exe" --title "lipano ${{ github.ref_name }}" --generate-notes
